<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Денис — Спортик vs Неряха</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #1e1e2f;
            --card: #2d2d44;
            --text: #f0f0f0;
            --text-light: #b0b0c0;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --green: #4caf50;
            --red: #f44336;
            --yellow: #ffc107;
            --gray: #616161;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 16px;
            transition: 0.2s;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .hidden {
            display: none !important;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .header .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
        }
        .header .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-box {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 20px;
        }
        .auth-box h2 {
            font-size: 1.8rem;
        }
        .auth-box .sub {
            color: var(--text-light);
            margin-bottom: 16px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #3a3a5a;
            border-radius: 12px;
            background: #1a1a2e;
            color: white;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .auth-box input:focus {
            outline: none;
            border-color: #ffd93d;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            background: #ffd93d;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
        }
        .auth-box .btn-primary:hover {
            background: #ffc107;
        }
        .auth-box .toggle-link {
            text-align: center;
            margin-top: 12px;
            color: var(--text-light);
        }
        .auth-box .toggle-link span {
            color: #ffd93d;
            cursor: pointer;
            font-weight: 600;
        }

        /* ===== КНОПКИ ===== */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #ffd93d;
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #ffc107;
        }
        .btn-danger {
            background: #f44336;
            color: white;
        }
        .btn-danger:hover {
            background: #d32f2f;
        }
        .btn-success {
            background: var(--green);
            color: white;
        }
        .btn-success:hover {
            background: #388e3c;
        }

        /* ===== ЭКОНОМИЯ ===== */
        .savings-block .amount {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--yellow);
        }
        .savings-block .rate {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .savings-block .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* ===== МАСТУРБАЦИЯ (полностью заблюрена, пульсирует) ===== */
        .masturbation-block {
            background: linear-gradient(135deg, #ff6b9d, #b35eb5);
            border-radius: var(--radius);
            padding: 14px 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            filter: blur(8px);
            animation: pulse 2s ease-in-out infinite;
            user-select: none;
        }
        .masturbation-block.unblurred {
            filter: blur(0);
            animation: none;
        }
        .masturbation-block:hover {
            transform: scale(1.02);
        }
        .masturbation-title {
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .masturbation-count {
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            margin: 6px 0 2px;
            /* число не размывается отдельно, так как весь блок размыт */
        }
        .masturbation-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse {
            0% { filter: blur(8px); opacity: 0.9; }
            50% { filter: blur(6px); opacity: 1; }
            100% { filter: blur(8px); opacity: 0.9; }
        }

        /* ===== DOTA ===== */
        .dota-block {
            background: linear-gradient(145deg, #1a0f0a, #2d1810);
            border: 2px solid #b8860b;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.3);
        }
        .dota-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .dota-count {
            font-size: 3rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            font-family: 'Cinzel', 'Segoe UI', serif;
            letter-spacing: 2px;
        }
        .dota-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }
        .dota-controls button {
            background: #3a251a;
            border: 2px solid #b8860b;
            color: #d4af37;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .dota-controls button:hover {
            background: #b8860b;
            color: #1a0f0a;
            transform: scale(1.1);
        }
        .dota-controls input {
            width: 80px;
            padding: 8px 6px;
            background: #1a0f0a;
            border: 2px solid #b8860b;
            border-radius: 10px;
            color: #d4af37;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 700;
        }
        .dota-controls input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* ===== СПОРТИК / НЕРЯХА ===== */
        .today-card {
            text-align: center;
        }
        .today-card .date {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .today-card .status {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 6px 0;
        }
        .today-card .sub-status {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0 4px;
        }
        .btn-choice {
            flex: 1 1 70px;
            padding: 10px 8px;
            border: 2px solid #3a3a5a;
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-choice.active-sport {
            border-color: var(--green);
            background: rgba(76, 175, 80, 0.25);
            color: #81c784;
        }
        .btn-choice.active-sloppy {
            border-color: var(--red);
            background: rgba(244, 67, 54, 0.25);
            color: #ef9a9a;
        }
        .btn-choice.active-both {
            border-color: var(--yellow);
            background: rgba(255, 193, 7, 0.2);
            color: #ffd54f;
        }
        .btn-choice.active-none {
            border-color: var(--gray);
            background: rgba(97, 97, 97, 0.15);
            color: #aaa;
        }
        .btn-choice:hover {
            transform: scale(1.02);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 1.6rem;
            font-weight: 700;
        }
        .stat-item .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-light);
        }
        .stat-item.sport .number {
            color: var(--green);
        }
        .stat-item.sloppy .number {
            color: var(--red);
        }
        .stat-item.both .number {
            color: var(--yellow);
        }

        /* ===== ДНИ НЕДЕЛИ С ЗАМЕТКАМИ ===== */
        .weekdays-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .weekday-item {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 8px 10px;
        }
        .weekday-item label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .weekday-item input {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #3a3a5a;
            border-radius: 8px;
            background: #1a1a2e;
            color: white;
            font-size: 0.9rem;
            margin-top: 4px;
            max-width: 100%;
        }
        .weekday-item input:focus {
            outline: none;
            border-color: #ffd93d;
        }

        /* ===== КРЕСТИКИ-НОЛИКИ ===== */
        .ttt-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 240px;
            margin: 10px auto;
        }
        .ttt-cell {
            aspect-ratio: 1;
            background: #1a1a2e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #3a3a5a;
        }
        .ttt-cell:hover {
            background: #2a2a4a;
        }
        .ttt-cell.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .ttt-status {
            text-align: center;
            font-size: 1rem;
            margin: 6px 0;
            color: var(--text-light);
        }
        .ttt-reset {
            display: block;
            margin: 8px auto 0;
            padding: 6px 20px;
            background: var(--yellow);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
        }

        /* ===== КУРСЫ ВАЛЮТ ===== */
        .currency-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }
        .currency-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .currency-item .pair {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .currency-item .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--yellow);
        }

        /* ===== ВРЕМЯ СТОЛИЦ ===== */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 6px;
        }
        .time-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
        }
        .time-item .city {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .time-item .time {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* ===== ИГРА «СОБЕРИ НОСКИ И ТРУСЫ» (5 предметов внутри оверлея) ===== */
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-overlay.hidden {
            display: none;
        }
        .game-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .game-box h2 {
            margin-bottom: 6px;
        }
        .game-box .sub {
            color: var(--text-light);
            margin-bottom: 14px;
        }
        .sock-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 12px 0 18px;
            justify-items: center;
        }
        .sock-item-game {
            font-size: 2.8rem;
            cursor: pointer;
            transition: 0.2s;
            background: #3a3a5a;
            border-radius: 12px;
            padding: 12px 6px;
            width: 100%;
            border: 2px solid transparent;
            user-select: none;
        }
        .sock-item-game:hover {
            transform: scale(1.05);
            background: #4a4a6a;
        }
        .sock-item-game.collected {
            opacity: 0.3;
            transform: scale(0.9);
            filter: grayscale(1);
            pointer-events: none;
            border-color: var(--green);
        }
        .game-progress {
            font-size: 1rem;
            font-weight: 600;
            margin: 6px 0;
            color: var(--text-light);
        }
        .game-complete {
            color: var(--yellow);
            font-size: 1.2rem;
            font-weight: 700;
            margin: 10px 0;
        }
        .game-box .btn-start-game {
            padding: 10px 28px;
            background: var(--green);
            border: none;
            border-radius: 14px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }

        /* ===== ОСНОВНАЯ ПАНЕЛЬ ===== */
        .main-panel {
            display: grid;
            grid-column: 1 / -1;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 600px) {
            .app-container {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .weekdays-grid {
                grid-template-columns: 1fr;
            }
            .ttt-grid {
                max-width: 200px;
            }
            .time-grid {
                grid-template-columns: 1fr 1fr;
            }
            .currency-grid {
                grid-template-columns: 1fr 1fr;
            }
            .main-panel {
                grid-template-columns: 1fr;
            }
            .sock-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .sock-item-game {
                font-size: 2.2rem;
                padding: 10px 4px;
            }
            .game-box {
                max-width: 300px;
            }
        }
        @media (min-width: 1200px) {
            .main-panel {
                grid-template-columns: repeat(3, 1fr);
            }
            .weekdays-grid {
                grid-template-columns: 1fr 1fr;
            }
            .time-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .reset-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* Цитата */
        .quote-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            font-style: italic;
            color: var(--text-light);
            border-left: 4px solid #ffd93d;
            grid-column: 1 / -1;
        }
        .quote-box .author {
            font-style: normal;
            font-weight: 600;
            color: var(--text);
            margin-top: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- ===== ИГРА «СОБЕРИ НОСКИ И ТРУСЫ» (оверлей) ===== -->
    <div class="game-overlay" id="gameOverlay">
        <div class="game-box">
            <h2>🧦 Собери носки и трусы!</h2>
            <div class="sub">Кликни на каждый предмет, чтобы отправить в корзину</div>
            <div class="sock-grid" id="sockGrid"></div>
            <div class="game-progress" id="sockProgress">Собрано: 0 / 5</div>
            <div id="gameCompleteMessage" class="hidden game-complete">🎉 Всё собрано! Приложение разблокировано!</div>
            <button class="btn-start-game" id="startGameBtn">🔄 Начать заново</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div class="app-container" id="app">

        <!-- ХЕДЕР -->
        <div class="header">
            <h1>🏋️‍♂️ Денис</h1>
            <div class="user-info" id="userInfo">
                <span id="userEmail"></span>
                <button class="logout-btn" id="logoutBtn">🚪</button>
            </div>
        </div>

        <!-- АВТОРИЗАЦИЯ -->
        <div id="authSection" class="auth-box" style="grid-column:1/-1;">
            <h2 id="authTitle">Вход</h2>
            <div class="sub" id="authSub">Войди, чтобы продолжить</div>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Пароль (≥ 6 символов)" />
            <button class="btn-primary" id="authBtn">Войти</button>
            <div class="toggle-link">
                <span id="toggleText">Нет аккаунта? </span>
                <span id="toggleLink">Зарегистрироваться</span>
            </div>
        </div>

        <!-- ОСНОВНОЙ ИНТЕРФЕЙС (показывается после авторизации и игры) -->
        <div id="mainPanel" class="main-panel hidden"></div>
    </div>

    <script>
        // ================================================================
        // 1. FIREBASE
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAbiVXdC3ctylepTMnhr4sqgZ2rqt6C3gY",
            authDomain: "denis-6f30c.firebaseapp.com",
            projectId: "denis-6f30c",
            storageBucket: "denis-6f30c.firebasestorage.app",
            messagingSenderId: "527961937380",
            appId: "1:527961937380:web:6ac6fa61275ff1bf2aa3f1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        // 2. ИГРА «СОБЕРИ НОСКИ И ТРУСЫ» (5 предметов)
        // ================================================================
        const gameOverlay = document.getElementById('gameOverlay');
        const sockGrid = document.getElementById('sockGrid');
        const sockProgress = document.getElementById('sockProgress');
        const gameCompleteMessage = document.getElementById('gameCompleteMessage');
        const startGameBtn = document.getElementById('startGameBtn');

        let collectedCount = 0;
        const totalItems = 5; // 3 носка + 2 труса
        let gameCompleted = false;

        // Массив эмодзи: 3 носка, 2 труса
        const emojis = ['🧦', '🧦', '🧦', '🩲', '🩲'];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderSocks() {
            sockGrid.innerHTML = '';
            const shuffled = shuffleArray([...emojis]);
            shuffled.forEach((emoji) => {
                const div = document.createElement('div');
                div.className = 'sock-item-game';
                div.textContent = emoji;
                div.dataset.collected = 'false';
                div.addEventListener('click', () => collectSock(div));
                sockGrid.appendChild(div);
            });
        }

        function collectSock(el) {
            if (gameCompleted) return;
            if (el.dataset.collected === 'true') return;
            el.dataset.collected = 'true';
            el.classList.add('collected');
            collectedCount++;
            updateSockProgress();
            if (collectedCount === totalItems) {
                gameCompleted = true;
                gameCompleteMessage.classList.remove('hidden');
                setTimeout(() => {
                    gameOverlay.classList.add('hidden');
                    const mainPanel = document.getElementById('mainPanel');
                    mainPanel.classList.remove('hidden');
                    buildMainPanel();
                }, 1200);
            }
        }

        function updateSockProgress() {
            sockProgress.textContent = `Собрано: ${collectedCount} / ${totalItems}`;
        }

        function resetGame() {
            collectedCount = 0;
            gameCompleted = false;
            gameCompleteMessage.classList.add('hidden');
            renderSocks();
            updateSockProgress();
            gameOverlay.classList.remove('hidden');
            const mainPanel = document.getElementById('mainPanel');
            mainPanel.classList.add('hidden');
            if (savingsRunning) {
                startStopSavings();
            }
            savings = 0;
            updateSavingsDisplay();

        // ================================================================

        // ================================================================

        function initSavings() {
            setRateBtn.addEventListener('click', () => {
                const val = parseFloat(rateInput.value);
                if (val && val > 0) {
                    ratePerSecond = val;
                    savingsRate.textContent = ratePerSecond + ' ₽ / сек';
                    if (currentUser) {
                        db.collection('users').doc(currentUser.uid).set({ ratePerSecond }, { merge: true })
                            .catch(e => console.warn('Ошибка сохранения ставки:', e));
                    }
                } else {
                    alert('Введите положительное число');
                }
            });

            resetSavingsBtn.addEventListener('click', () => {
                if (confirm('Сбросить счётчик экономии?')) {
                    savings = 0;
                    updateSavingsDisplay();
                    if (currentUser) {
                        db.collection('users').doc(currentUser.uid).set({ savings: 0 }, { merge: true })
                            .catch(e => console.warn('Ошибка сброса экономии:', e));
                    }
                }
            });

        function startStopSavings() {
            if (savingsRunning) {
                clearInterval(savingsInterval);
                savingsRunning = false;
                startStopBtn.textContent = '▶ Старт';
                startStopBtn.classList.remove('btn-danger');
                startStopBtn.classList.add('btn-success');
            } else {
                savingsRunning = true;
                startStopBtn.textContent = '⏹ Стоп';
                startStopBtn.classList.remove('btn-success');
                startStopBtn.classList.add('btn-danger');
                if (savingsInterval) clearInterval(savingsInterval);
                savingsInterval = setInterval(() => {
                    savings += ratePerSecond;
                    updateSavingsDisplay();
                    if (currentUser && Math.floor(savings) % 10 === 0) {
                        db.collection('users').doc(currentUser.uid).set({ savings }, { merge: true })
                            .catch(e => console.warn('Ошибка сохранения экономии:', e));
                    }
                }, 1000);
            }
        }

        function updateSavingsDisplay() {
            if (savingsDisplay) savingsDisplay.textContent = Math.floor(savings) + ' ₽';
        }

        function loadSavingsFromFirebase() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.savings) savings = data.savings;
                    if (data.ratePerSecond) {
                        ratePerSecond = data.ratePerSecond;
                        rateInput.value = ratePerSecond;
                        savingsRate.textContent = ratePerSecond + ' ₽ / сек';

        // Спортик / Неряха
        let allEntries = [];

        function initSportik() {
            choiceBtns.forEach(btn => {
                btn.addEventListener('click', () => setChoice(btn.dataset.choice));
            });

        function getTodayKey() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function renderToday() {
            const today = new Date();
            todayDate.textContent = today.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
            const todayKey = getTodayKey();
            const todayDoc = allEntries.find(d => d.id === todayKey);
            if (todayDoc) {
                const choice = todayDoc.data().choice || 'none';
                const emoji = choice === 'sport' ? '🏃' : choice === 'sloppy' ? '🧹' : choice === 'both' ? '🤷' : '😐';
                const label = choice === 'sport' ? 'Спортик!' : choice === 'sloppy' ? 'Неряха!' : choice === 'both' ?
                    'И то, и другое!' : 'Ничего...';

        function renderStats() {

        async function setChoice(choice) {
            if (!currentUser) return;
            const todayKey = getTodayKey();
            const docRef = db.collection('users').doc(currentUser.uid).collection('days').doc(todayKey);
            try {
                await docRef.set({ choice, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

                alert('Ошибка сохранения: ' + e.message);

        }

        function subscribeToDays(user) {
            if (unsubscribeDays) unsubscribeDays();
            const ref = db.collection('users').doc(user.uid).collection('days');
            unsubscribeDays = ref.onSnapshot((snapshot) => {

            }, (error) => {

        // Дни недели
        const weekdays = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

        function initWeekdays() {
            renderWeekdays([]);
            loadWeekNotes();
        }

        function renderWeekdays(notes) {
            weekdaysGrid.innerHTML = '';
            weekdays.forEach((day, index) => {
                const div = document.createElement('div');
                div.className = 'weekday-item';
                const label = document.createElement('label');

                input.dataset.index = index;

        // Крестики-нолики
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameOver = false;

        function initTTT() {
            tttReset.addEventListener('click', resetTTT);
            renderTTT();
        }

        function renderTTT() {
            tttGrid.innerHTML = '';
            board.forEach((cell, idx) => {
                const div = document.createElement('div');
                div.className = 'ttt-cell';
                if (cell !== '' || gameOver) div.classList.add('disabled');
                div.textContent = cell;
                div.dataset.index = idx;
                div.addEventListener('click', () => handleTTTClick(idx));
                tttGrid.appendChild(div);
            });
        }

        function checkWinner(board) {
            const lines = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            for (let line of lines) {
                const [a, b, c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            if (board.every(cell => cell !== '')) return 'draw';
            return null;
        }

        function handleTTTClick(idx) {
            if (gameOver) return;
            if (board[idx] !== '') return;
            if (currentPlayer !== 'X') return;
            board[idx] = 'X';
            renderTTT();
            const winner = checkWinner(board);
            if (winner) {
                gameOver = true;
                tttStatus.textContent = winner === 'draw' ? 'Ничья!' : 'Ты выиграл! 🎉';
                return;
            }
            currentPlayer = 'O';
            tttStatus.textContent = 'Ход ПК (O)...';
            setTimeout(() => computerMove(), 400);
        }

        function computerMove() {
            if (gameOver) return;
            let move = findBestMove(board);
            if (move === -1) {
                const winner = checkWinner(board);
                if (winner) {
                    gameOver = true;
                    tttStatus.textContent = winner === 'draw' ? 'Ничья!' : 'Ты выиграл! 🎉';
                }
                return;
            }
            board[move] = 'O';
            renderTTT();
            const winner = checkWinner(board);
            if (winner) {
                gameOver = true;
                tttStatus.textContent = winner === 'draw' ? 'Ничья!' : 'ПК выиграл! 😢';
                return;
            }
            currentPlayer = 'X';
            tttStatus.textContent = 'Ваш ход (X)';
        }

        function findBestMove(board) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    if (checkWinner(board) === 'O') {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'X';
                    if (checkWinner(board) === 'X') {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            if (empty.length === 0) return -1;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function resetTTT() {
            board = ['', '', '', '', '', '', '', '', ''];

        ];

        function initQuote() {
            setRandomQuote();
        }

        function setRandomQuote() {
            const q = quotes[Math.floor(Math.random() * quotes.length)];
            quoteBox.innerHTML = `«${q.text}»<div class="author">${q.author}</div>`;
        }

        // Сброс
        function initReset() {
            resetBtn.addEventListener('click', resetAllDays);
        }

        async function resetAllDays() {
            if (!currentUser) return;
            if (!confirm('Точно сбросить все записи за все дни? Это необратимо!')) return;
            try {
                const snapshot = await db.collection('users').doc(currentUser.uid).collection('days').get();
                const batch = db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
            } catch (e) {
                alert('Ошибка сброса: ' + e.message);
            }
        }

        // ================================================================
        // 6. АВТОРИЗАЦИЯ
        // ================================================================
        const authSection = document.getElementById('authSection');
        const authTitle = document.getElementById('authTitle');
        const authSub = document.getElementById('authSub');
        const authBtn = document.getElementById('authBtn');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const userEmailSpan = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        let currentUser = null;

        authBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const pass = passwordInput.value.trim();
            if (!email || !pass) return alert('Заполните все поля');
            try {
                if (authBtn.textContent === 'Войти') {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                }
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        });

        toggleLink.addEventListener('click', () => {
            const isLogin = authBtn.textContent === 'Войти';
            authBtn.textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
            authTitle.textContent = isLogin ? 'Регистрация' : 'Вход';
            authSub.textContent = isLogin ? 'Создай аккаунт' : 'Войди, чтобы продолжить';
            toggleText.textContent = isLogin ? 'Уже есть аккаунт? ' : 'Нет аккаунта? ';
            toggleLink.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
        });

        logoutBtn.addEventListener('click', async () => {
            await auth.signOut();
            if (unsubscribeDays) { unsubscribeDays();
                unsubscribeDays = null; }
            allEntries = [];
            renderAll();
            if (savingsRunning) startStopSavings();
            if (savingsInterval) clearInterval(savingsInterval);
            savingsRunning = false;
            startStopBtn.textContent = '▶ Старт';
            startStopBtn.classList.remove('btn-danger');
            startStopBtn.classList.add('btn-success');
            const panel = document.getElementById('mainPanel');
            panel.classList.add('hidden');
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                userEmailSpan.textContent = user.email;
                authSection.style.display = 'none';
                const gameCompletedFlag = localStorage.getItem('gameCompleted_' + user.uid);
                if (gameCompletedFlag === 'true') {
                    gameOverlay.classList.add('hidden');
                    const panel = document.getElementById('mainPanel');
                    panel.classList.remove('hidden');
                    buildMainPanel();
                    loadSavingsFromFirebase();
                    loadDotaFromFirebase();
                    loadMasturbationState();
                    loadWeekNotes();
                    subscribeToDays(user);
                } else {
                    resetGame();
                }
            } else {
                currentUser = null;
                authSection.style.display = 'block';
                const panel = document.getElementById('mainPanel');
                panel.classList.add('hidden');
                if (unsubscribeDays) { unsubscribeDays();
                    unsubscribeDays = null; }
                allEntries = [];
                renderAll();
                if (savingsRunning) startStopSavings();
                if (savingsInterval) clearInterval(savingsInterval);
                savingsRunning = false;
                startStopBtn.textContent = '▶ Старт';
                startStopBtn.classList.remove('btn-danger');
                startStopBtn.classList.add('btn-success');
                gameOverlay.classList.add('hidden');
            }
        });

        // ================================================================
        // 7. СТАРТ
        // ================================================================
        // Инициализация игры при первом запуске
        renderSocks();
        updateSockProgress();

        console.log('Приложение готово.');
    </script>
</body>
</html>
