<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Денис — давай за дело!</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* ===== Переменные ===== */
        :root {
            --bg: #1e1e2f;
            --card: #2d2d44;
            --text: #f0f0f0;
            --text-light: #b0b0c0;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --green: #4caf50;
            --red: #f44336;
            --yellow: #ffc107;
            --gray: #616161;
            --font: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .light-theme {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #555;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* ===== Сброс и общие стили ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
            position: relative;
        }

        .app-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 16px;
            transition: 0.2s;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hidden {
            display: none !important;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: var(--yellow);
            color: #1a1a2e;
        }
        .btn-primary:hover {
            background: #ffc107;
        }
        .btn-danger {
            background: var(--red);
            color: white;
        }
        .btn-danger:hover {
            background: #d32f2f;
        }
        .btn-success {
            background: var(--green);
            color: white;
        }
        .btn-success:hover {
            background: #388e3c;
        }

        /* ===== Хедер ===== */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
            z-index: 1;
            position: relative;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            flex: 1;
            margin: 0;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .header .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
        }
        .header .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .theme-toggle {
            background: transparent;
            border: 2px solid var(--text-light);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text);
            transition: 0.2s;
        }
        .theme-toggle:hover {
            background: var(--text-light);
            color: var(--bg);
        }

        /* ===== Авторизация ===== */
        .auth-box {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 20px;
        }
        .auth-box h2 {
            font-size: 1.8rem;
        }
        .auth-box .sub {
            color: var(--text-light);
            margin-bottom: 16px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #3a3a5a;
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .auth-box input:focus {
            outline: none;
            border-color: var(--yellow);
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--yellow);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
        }
        .auth-box .btn-primary:hover {
            background: #ffc107;
        }
        .auth-box .toggle-link {
            text-align: center;
            margin-top: 12px;
            color: var(--text-light);
        }
        .auth-box .toggle-link span {
            color: var(--yellow);
            cursor: pointer;
            font-weight: 600;
        }

        /* ===== Блоки ===== */
        .savings-block .amount {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--yellow);
        }
        .savings-block .rate {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* Мастурбация */
        .masturbation-block {
            background: linear-gradient(135deg, #ff6b9d, #b35eb5);
            border-radius: var(--radius);
            padding: 14px 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            filter: blur(8px);
            animation: pulse 2s ease-in-out infinite;
            user-select: none;
        }
        .masturbation-block.unblurred {
            filter: blur(0);
            animation: none;
        }
        .masturbation-block:hover {
            transform: scale(1.02);
        }
        .masturbation-title {
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-size: 1.1rem;
        }
        .masturbation-count {
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            margin: 6px 0 2px;
        }
        .masturbation-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse {
            0% { filter: blur(8px); opacity: 0.9; }
            50% { filter: blur(6px); opacity: 1; }
            100% { filter: blur(8px); opacity: 0.9; }
        }

        /* Dota */
        .dota-block {
            background: linear-gradient(145deg, #1a0f0a, #2d1810);
            border: 2px solid #b8860b;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.3);
            position: relative;
            overflow: hidden;
        }
        .dota-block .sad-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 2rem;
            opacity: 0.15;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 0;
        }
        .dota-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            position: relative;
            z-index: 1;
        }
        .dota-count {
            font-size: 3rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            font-family: 'Cinzel', 'Segoe UI', serif;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        .dota-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .dota-controls button {
            background: #3a251a;
            border: 2px solid #b8860b;
            color: #d4af37;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .dota-controls button:hover {
            background: #b8860b;
            color: #1a0f0a;
            transform: scale(1.1);
        }
        .dota-controls input {
            width: 80px;
            padding: 8px 6px;
            background: #1a0f0a;
            border: 2px solid #b8860b;
            border-radius: 10px;
            color: #d4af37;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 700;
        }
        .dota-controls input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* Аналоговые часы (отдельный блок) */
        .analog-clock-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .analog-clock-canvas {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: var(--card);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: block;
        }

        /* Часы столиц */
        .city-clocks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 6px;
        }
        .city-clock {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }
        .city-clock .city-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 4px;
        }
        .city-clock canvas {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--card);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: block;
            margin: 0 auto;
        }

        /* Спортик / Неряха (блок "Сегодня") */
        .today-card {
            text-align: center;
        }
        .today-card .date {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .today-card .status {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 6px 0;
        }
        .today-card .sub-status {
            font-size: 0.9rem;
            color: var(--text-light);
            min-height: 1.5em;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0 4px;
        }
        .btn-choice {
            flex: 1 1 70px;
            padding: 10px 8px;
            border: 2px solid #3a3a5a;
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-choice.active-sport {
            border-color: var(--green);
            background: rgba(76, 175, 80, 0.25);
            color: #81c784;
        }
        .btn-choice.active-sloppy {
            border-color: var(--red);
            background: rgba(244, 67, 54, 0.25);
            color: #ef9a9a;
        }
        .btn-choice.active-both {
            border-color: var(--yellow);
            background: rgba(255, 193, 7, 0.2);
            color: #ffd54f;
        }
        .btn-choice.active-none {
            border-color: var(--gray);
            background: rgba(97, 97, 97, 0.15);
            color: #aaa;
        }
        .btn-choice:hover {
            transform: scale(1.02);
        }

        .streak-container {
            display: flex;
            justify-content: space-around;
            margin: 10px 0 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .streak-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .streak-item .emoji {
            font-size: 1.2rem;
        }
        .streak-item .count {
            font-weight: 700;
        }
        .streak-item.sport .count {
            color: var(--green);
        }
        .streak-item.sloppy .count {
            color: var(--red);
        }
        .streak-item.both .count {
            color: var(--yellow);
        }
        .streak-item.none .count {
            color: var(--gray);
        }

        .mini-chart {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .mini-chart .day-dot {
            font-size: 1.4rem;
            line-height: 1;
            filter: grayscale(0.2);
        }
        .mini-chart .day-dot.today {
            border: 2px solid var(--yellow);
            border-radius: 50%;
            padding: 0 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 1.6rem;
            font-weight: 700;
        }
        .stat-item .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-light);
        }
        .stat-item.sport .number {
            color: var(--green);
        }
        .stat-item.sloppy .number {
            color: var(--red);
        }
        .stat-item.both .number {
            color: var(--yellow);
        }

        /* Заметки по дням */
        .weekdays-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .weekday-item {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 8px 10px;
        }
        .weekday-item label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .weekday-item input {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #3a3a5a;
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-size: 0.9rem;
            margin-top: 4px;
            max-width: 100%;
        }
        .weekday-item input:focus {
            outline: none;
            border-color: var(--yellow);
        }

        /* Крестики-нолики */
        .ttt-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 240px;
            margin: 10px auto;
        }
        .ttt-cell {
            aspect-ratio: 1;
            background: var(--card);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid var(--text-light);
        }
        .ttt-cell:hover {
            background: var(--text-light);
            opacity: 0.6;
        }
        .ttt-cell.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .ttt-status {
            text-align: center;
            font-size: 1rem;
            margin: 6px 0;
            color: var(--text-light);
        }
        .ttt-reset {
            display: block;
            margin: 8px auto 0;
            padding: 6px 20px;
            background: var(--yellow);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
        }
        .ttt-scores {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .ttt-scores span {
            font-weight: 700;
        }

        /* Змейка */
        .snake-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .snake-canvas {
            border: 2px solid var(--text-light);
            border-radius: 10px;
            background: var(--card);
            max-width: 100%;
            touch-action: none;
        }
        .snake-score {
            font-size: 1.2rem;
            margin-bottom: 6px;
        }
        .snake-controls {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .snake-controls button {
            padding: 6px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            background: var(--yellow);
            color: #1a1a2e;
            cursor: pointer;
        }
        .snake-touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 6px;
            margin-top: 10px;
            justify-content: center;
        }
        .snake-touch-controls button {
            width: 60px;
            height: 60px;
            font-size: 2rem;
            border-radius: 16px;
            border: 2px solid var(--text-light);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            touch-action: manipulation;
        }
        .snake-touch-controls .empty {
            visibility: hidden;
        }

        /* Курсы валют */
        .currency-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }
        .currency-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .currency-item .pair {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .currency-item .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--yellow);
        }

        /* Фоновые слова */
        .bg-words {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-word {
            position: absolute;
            font-size: 3rem;
            font-weight: 900;
            color: var(--text);
            opacity: 0.04;
            white-space: nowrap;
            transition: all 2s ease;
            user-select: none;
        }

        /* Игра с носками */
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-overlay.hidden {
            display: none;
        }
        .game-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .game-box h2 {
            margin-bottom: 6px;
        }
        .game-box .sub {
            color: var(--text-light);
            margin-bottom: 14px;
        }
        .sock-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 12px 0 18px;
            justify-items: center;
        }
        .sock-item-game {
            font-size: 2.8rem;
            cursor: pointer;
            transition: 0.2s;
            background: #3a3a5a;
            border-radius: 12px;
            padding: 12px 6px;
            width: 100%;
            border: 2px solid transparent;
            user-select: none;
        }
        .sock-item-game:hover {
            transform: scale(1.05);
            background: #4a4a6a;
        }
        .sock-item-game.collected {
            opacity: 0.3;
            transform: scale(0.9);
            filter: grayscale(1);
            pointer-events: none;
            border-color: var(--green);
        }
        .game-progress {
            font-size: 1rem;
            font-weight: 600;
            margin: 6px 0;
            color: var(--text-light);
        }
        .game-complete {
            color: var(--yellow);
            font-size: 1.2rem;
            font-weight: 700;
            margin: 10px 0;
        }
        .game-box .btn-start-game {
            padding: 10px 28px;
            background: var(--green);
            border: none;
            border-radius: 14px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .reset-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            font-style: italic;
            color: var(--text-light);
            border-left: 4px solid var(--yellow);
            grid-column: 1 / -1;
        }
        .quote-box .author {
            font-style: normal;
            font-weight: 600;
            color: var(--text);
            margin-top: 4px;
            font-size: 0.8rem;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            pointer-events: none;
        }
        .toast {
            background: var(--card);
            color: var(--text);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border-left: 6px solid var(--yellow);
            font-weight: 600;
            font-size: 1rem;
            animation: slideUp 0.4s ease, fadeOut 0.4s ease 2.6s forwards;
            pointer-events: auto;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* ===== Адаптация ===== */
        @media (max-width: 600px) {
            .app-grid { grid-template-columns: 1fr; gap: 14px; }
            .header h1 { font-size: 1.6rem; }
            .weekdays-grid { grid-template-columns: 1fr; }
            .ttt-grid { max-width: 200px; }
            .currency-grid { grid-template-columns: 1fr 1fr; }
            .city-clocks { grid-template-columns: 1fr 1fr; }
            .city-clock canvas { width: 80px; height: 80px; }
            .snake-touch-controls { grid-template-columns: repeat(3, 50px); }
            .snake-touch-controls button { width: 50px; height: 50px; font-size: 1.6rem; }
            .sock-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .sock-item-game { font-size: 2.2rem; padding: 10px 4px; }
            .game-box { max-width: 300px; }
            .streak-container { flex-direction: column; align-items: center; }
            .analog-clock-canvas { width: 160px; height: 160px; }
        }

        @media (min-width: 1200px) {
            .weekdays-grid { grid-template-columns: 1fr 1fr; }
            .city-clocks { grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>

    <!-- ===== ФОНОВЫЕ СЛОВА ===== -->
    <div class="bg-words" id="bgWords"></div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== ИГРА «СОБЕРИ НОСКИ» ===== -->
    <div class="game-overlay" id="gameOverlay">
        <div class="game-box">
            <h2>🧦 Собери носки и трусы!</h2>
            <div class="sub">Кликни на каждый предмет</div>
            <div class="sock-grid" id="sockGrid"></div>
            <div class="game-progress" id="sockProgress">Собрано: 0 / 5</div>
            <div id="gameCompleteMessage" class="hidden game-complete">🎉 Готово!</div>
            <button class="btn-start-game" id="startGameBtn">🔄 Заново</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
    <div class="app-grid" id="app">

        <!-- ХЕДЕР -->
        <div class="header">
            <h1>Денис давай за дело!</h1>
            <div class="user-info" id="userInfo">
                <span id="userEmail"></span>
                <button class="theme-toggle" id="themeToggle">🌓</button>
                <button class="logout-btn" id="logoutBtn">🚪</button>
            </div>
        </div>

        <!-- АВТОРИЗАЦИЯ -->
        <div id="authSection" class="auth-box" style="grid-column:1/-1;">
            <h2 id="authTitle">Вход</h2>
            <div class="sub" id="authSub">Войди, чтобы продолжить</div>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Пароль (≥ 6 символов)" />
            <button class="btn-primary" id="authBtn">Войти</button>
            <div class="toggle-link">
                <span id="toggleText">Нет аккаунта? </span>
                <span id="toggleLink">Зарегистрироваться</span>
            </div>
        </div>

        <!-- ОСНОВНАЯ ПАНЕЛЬ -->
        <div id="mainPanel" class="hidden" style="grid-column:1/-1; display:contents;"></div>
    </div>

    <script>
        /**
         * ================================================================
         *  МОДУЛЬНОЕ ПРИЛОЖЕНИЕ – ВЕСЬ КОД ОРГАНИЗОВАН В ОБЪЕКТЫ
         *  Автор: Senior Developer
         * ================================================================
         */

        // ================================================================
        // 1. УТИЛИТЫ
        // ================================================================
        const Utils = {
            showToast(message) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
            },

            shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            },

            todayKey() {
                const d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            },

            sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        };

        // ================================================================
        // 2. FIREBASE МЕНЕДЖЕР
        // ================================================================
        const FirebaseManager = (() => {
            const config = {
                apiKey: "AIzaSyAbiVXdC3ctylepTMnhr4sqgZ2rqt6C3gY",
                authDomain: "denis-6f30c.firebaseapp.com",
                projectId: "denis-6f30c",
                storageBucket: "denis-6f30c.firebasestorage.app",
                messagingSenderId: "527961937380",
                appId: "1:527961937380:web:6ac6fa61275ff1bf2aa3f1"
            };
            firebase.initializeApp(config);
            const auth = firebase.auth();
            const db = firebase.firestore();

            async function getUserDoc(uid) {
                const ref = db.collection('users').doc(uid);
                const snap = await ref.get();
                if (!snap.exists) {
                    await ref.set({ createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                }
                return ref;
            }

            async function getUserData(uid) {
                const ref = await getUserDoc(uid);
                const snap = await ref.get();
                return snap.data() || {};
            }

            async function updateUser(uid, data) {
                const ref = await getUserDoc(uid);
                await ref.set(data, { merge: true });
            }

            function subscribeDays(uid, callback) {
                return db.collection('users').doc(uid).collection('days')
                    .onSnapshot(snapshot => callback(snapshot.docs), error => {
                        console.error('Ошибка подписки days:', error);
                        Utils.showToast('Ошибка загрузки дней');
                    });
            }

            return { auth, db, getUserData, updateUser, subscribeDays };
        })();

        // ================================================================
        // 3. ИГРА «СОБЕРИ НОСКИ»
        // ================================================================
        const SocksGame = {
            total: 5,
            collected: 0,
            completed: false,
            emojis: ['🧦', '🧦', '🧦', '🩲', '🩲'],

            init() {
                this.render();
                document.getElementById('startGameBtn').addEventListener('click', () => this.reset());
            },

            render() {
                const grid = document.getElementById('sockGrid');
                grid.innerHTML = '';
                const shuffled = Utils.shuffle([...this.emojis]);
                shuffled.forEach((emoji) => {
                    const div = document.createElement('div');
                    div.className = 'sock-item-game';
                    div.textContent = emoji;
                    div.dataset.collected = 'false';
                    div.addEventListener('click', () => this.collect(div));
                    grid.appendChild(div);
                });
                this.updateProgress();
            },

            collect(el) {
                if (this.completed || el.dataset.collected === 'true') return;
                el.dataset.collected = 'true';
                el.classList.add('collected');
                this.collected++;
                this.updateProgress();
                if (this.collected === this.total) {
                    this.completed = true;
                    document.getElementById('gameCompleteMessage').classList.remove('hidden');
                    setTimeout(() => {
                        document.getElementById('gameOverlay').classList.add('hidden');
                        document.getElementById('mainPanel').classList.remove('hidden');
                        App.startAllCounters();
                    }, 1200);
                }
            },

            updateProgress() {
                document.getElementById('sockProgress').textContent =
                    `Собрано: ${this.collected} / ${this.total}`;
            },

            reset() {
                this.collected = 0;
                this.completed = false;
                document.getElementById('gameCompleteMessage').classList.add('hidden');
                document.getElementById('gameOverlay').classList.remove('hidden');
                document.getElementById('mainPanel').classList.add('hidden');
                this.render();
                App.stopAllCounters();
            }
        };

        // ================================================================
        // 4. ОСНОВНОЕ ПРИЛОЖЕНИЕ (координатор)
        // ================================================================
        const App = {
            user: null,
            userData: {},
            allDays: [],
            unsubDays: null,

            // Счётчики
            savings: 0,
            rate: 5,
            masturbation: 116,
            dota: 0,
            masturbationBlurred: false,

            // Интервалы
            intervals: {
                savings: null,
                masturbation: null,
                dota: null,
                bgWords: null,
                tick: null,
            },

            // Модули
            modules: {},

            // ================================================================
            // ИНИЦИАЛИЗАЦИЯ
            // ================================================================
            async init() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                if (savedTheme === 'light') {
                    document.body.classList.add('light-theme');
                    document.getElementById('themeToggle').textContent = '🌞';
                }

                this.initAuth();
                SocksGame.init();
                this.initBgWords();

                document.getElementById('themeToggle').addEventListener('click', () => {
                    document.body.classList.toggle('light-theme');
                    const isLight = document.body.classList.contains('light-theme');
                    localStorage.setItem('theme', isLight ? 'light' : 'dark');
                    document.getElementById('themeToggle').textContent = isLight ? '🌞' : '🌓';
                });
            },

            // ================================================================
            // АВТОРИЗАЦИЯ
            // ================================================================
            initAuth() {
                const auth = FirebaseManager.auth;
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const authBtn = document.getElementById('authBtn');
                const toggleLink = document.getElementById('toggleLink');
                const toggleText = document.getElementById('toggleText');
                const authTitle = document.getElementById('authTitle');
                const authSub = document.getElementById('authSub');
                const logoutBtn = document.getElementById('logoutBtn');
                const userEmailSpan = document.getElementById('userEmail');

                let isLogin = true;

                const toggleMode = () => {
                    isLogin = !isLogin;
                    authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
                    authTitle.textContent = isLogin ? 'Вход' : 'Регистрация';
                    authSub.textContent = isLogin ? 'Войди, чтобы продолжить' : 'Создай аккаунт';
                    toggleText.textContent = isLogin ? 'Нет аккаунта? ' : 'Уже есть аккаунт? ';
                    toggleLink.textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
                };

                authBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    const pass = passwordInput.value.trim();
                    if (!email || !pass) return Utils.showToast('Заполните все поля');
                    try {
                        if (isLogin) {
                            await auth.signInWithEmailAndPassword(email, pass);
                        } else {
                            await auth.createUserWithEmailAndPassword(email, pass);
                        }
                    } catch (e) {
                        Utils.showToast('Ошибка: ' + e.message);
                    }
                });

                toggleLink.addEventListener('click', toggleMode);

                logoutBtn.addEventListener('click', async () => {
                    await auth.signOut();
                    this.stopAllCounters();
                    document.getElementById('mainPanel').classList.add('hidden');
                    document.getElementById('gameOverlay').classList.add('hidden');
                    document.getElementById('authSection').style.display = 'block';
                });

                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        this.user = user;
                        userEmailSpan.textContent = user.email;
                        document.getElementById('authSection').style.display = 'none';

                        const gameCompleted = localStorage.getItem('gameCompleted_' + user.uid);
                        if (gameCompleted === 'true') {
                            document.getElementById('gameOverlay').classList.add('hidden');
                            document.getElementById('mainPanel').classList.remove('hidden');
                            await this.loadUserData();
                            this.buildMainPanel();
                            this.startAllCounters();
                        } else {
                            SocksGame.reset();
                        }
                    } else {
                        this.user = null;
                        document.getElementById('authSection').style.display = 'block';
                        document.getElementById('mainPanel').classList.add('hidden');
                        document.getElementById('gameOverlay').classList.add('hidden');
                        if (this.unsubDays) { this.unsubDays();
                            this.unsubDays = null; }
                        this.stopAllCounters();
                    }
                });
            },

            // ================================================================
            // ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ
            // ================================================================
            async loadUserData() {
                if (!this.user) return;
                try {
                    const data = await FirebaseManager.getUserData(this.user.uid);
                    this.userData = data;

                    this.savings = data.savings || 0;
                    this.rate = data.ratePerSecond || 5;
                    this.masturbation = data.masturbationCount || 116;
                    this.dota = data.dotaCount || 0;

                    const savedBlur = localStorage.getItem('masturbation_unblurred_' + this.user.uid);
                    this.masturbationBlurred = (savedBlur === 'true');

                    if (this.unsubDays) this.unsubDays();
                    this.unsubDays = FirebaseManager.subscribeDays(this.user.uid, (docs) => {
                        this.allDays = docs;
                        if (this.modules.sportik) this.modules.sportik.render();
                        if (this.modules.weekdays) this.modules.weekdays.render();
                    });

                } catch (e) {
                    console.error('Ошибка загрузки данных:', e);
                    Utils.showToast('Ошибка загрузки данных');
                }
            },

            // ================================================================
            // ПОСТРОЕНИЕ ПАНЕЛИ
            // ================================================================
            buildMainPanel() {
                const panel = document.getElementById('mainPanel');
                panel.innerHTML = this.getPanelHTML();
                this.initModules();
            },

            getPanelHTML() {
                return `
                    <!-- Экономия -->
                    <div class="card savings-block" id="savingsBlock">
                        <div class="card-title">💰 Сэкономлено</div>
                        <div class="amount" id="savingsDisplay">${Math.floor(this.savings)} ₽</div>
                        <div class="rate" id="savingsRate">${this.rate} ₽ / сек</div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin:6px 0;">
                            <input type="number" id="rateInput" value="${this.rate}" step="0.5" min="0.5" style="width:100px; padding:6px 10px; border-radius:8px; border:2px solid #3a3a5a; background:var(--card); color:var(--text);" />
                            <button class="btn btn-primary" id="setRateBtn">Установить</button>
                        </div>
                        <button class="btn btn-danger" id="resetSavingsBtn" style="margin-top:6px;">Сброс</button>
                    </div>

                    <!-- Мастурбация -->
                    <div class="card masturbation-block ${this.masturbationBlurred ? '' : 'unblurred'}" id="masturbationBlock">
                        <div class="masturbation-title" id="masturbationTitle">Ты подрочил уже ${this.masturbation} раз!</div>
                        <div class="masturbation-count" id="masturbationCount">${this.masturbation}</div>
                        <div class="masturbation-hint">🔒 ${this.masturbationBlurred ? 'Нажмите, чтобы разблокировать' : 'Разблокировано'}</div>
                    </div>

                    <!-- Dota -->
                    <div class="card dota-block" id="dotaBlock">
                        <div class="sad-emojis" id="sadEmojis"></div>
                        <div class="dota-title">⚔️ Приогранные катки в Dota 2 🏆</div>
                        <div class="dota-count" id="dotaCount">${this.dota}</div>
                        <div class="dota-controls">
                            <button id="dotaMinus">−</button>
                            <input type="number" id="dotaInput" value="${this.dota}" min="0" step="1" />
                            <button id="dotaPlus">+</button>
                        </div>
                        <button class="btn btn-danger" id="resetDotaBtn" style="margin-top:6px; background:#b8860b; color:#1a0f0a;">Сброс</button>
                    </div>

                    <!-- Аналоговые часы (отдельный блок) -->
                    <div class="card">
                        <div class="card-title">🕒 Аналоговые часы</div>
                        <div class="analog-clock-container">
                            <canvas id="analogClockCanvas" class="analog-clock-canvas" width="200" height="200"></canvas>
                        </div>
                    </div>

                    <!-- Часы столиц -->
                    <div class="card">
                        <div class="card-title">🕒 Время в столицах</div>
                        <div class="city-clocks" id="cityClocks"></div>
                    </div>

                    <!-- Спортик / Неряха (блок "Сегодня") -->
                    <div class="card today-card" id="sportikCard">
                        <div class="card-title">📋 Сегодня</div>
                        <div class="date" id="todayDate"></div>
                        <div class="status" id="todayStatus">😐</div>
                        <div class="sub-status" id="todaySub">Выбери, кем ты был сегодня</div>
                        <div class="button-group">
                            <button class="btn-choice" data-choice="sport">🏃 Спортик</button>
                            <button class="btn-choice" data-choice="sloppy">🧹 Неряха</button>
                            <button class="btn-choice" data-choice="both">🤷 Оба</button>
                            <button class="btn-choice" data-choice="none">😴 Ничего</button>
                        </div>
                        <div class="streak-container" id="streakContainer"></div>
                        <div class="mini-chart" id="miniChart"></div>
                        <div class="stats-grid">
                            <div class="stat-item sport"><div class="number" id="sportCount">0</div><div class="label">Спортик</div></div>
                            <div class="stat-item sloppy"><div class="number" id="sloppyCount">0</div><div class="label">Неряха</div></div>
                            <div class="stat-item both"><div class="number" id="bothCount">0</div><div class="label">Оба</div></div>
                        </div>
                        <div style="margin-top:12px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                            <input type="text" id="todayNoteInput" placeholder="Заметка на сегодня (до 30 симв.)" maxlength="30" style="flex:1; padding:6px 12px; border-radius:8px; border:2px solid #3a3a5a; background:var(--card); color:var(--text);" />
                            <button class="btn btn-primary" id="todayNoteBtn" style="padding:6px 16px;">➕</button>
                        </div>
                        <div id="todayNoteDisplay" style="margin-top:6px; font-size:0.9rem; color:var(--text-light);"></div>
                    </div>

                    <!-- Заметки по дням -->
                    <div class="card" id="weekdaysCard">
                        <div class="card-title">📝 Заметки по дням (до 30 симв.)</div>
                        <div class="weekdays-grid" id="weekdaysGrid"></div>
                    </div>

                    <!-- Крестики-нолики -->
                    <div class="card" id="tttCard">
                        <div class="card-title">❌⭕ Крестики-нолики (против ПК)</div>
                        <div class="ttt-grid" id="tttGrid"></div>
                        <div class="ttt-status" id="tttStatus">Ваш ход (X)</div>
                        <button class="ttt-reset" id="tttReset">🔄 Новая игра</button>
                        <div class="ttt-scores">
                            <span>🏆 Победы: <span id="tttWins">${this.userData.tttWins || 0}</span></span>
                            <span>💔 Поражения: <span id="tttLosses">${this.userData.tttLosses || 0}</span></span>
                        </div>
                    </div>

                    <!-- Змейка -->
                    <div class="card" id="snakeCard">
                        <div class="card-title">🐍 Змейка</div>
                        <div class="snake-container">
                            <div class="snake-score">Очки: <span id="snakeScore">0</span></div>
                            <canvas id="snakeCanvas" class="snake-canvas" width="300" height="300"></canvas>
                            <div class="snake-controls">
                                <button id="snakeStartBtn">▶ Старт</button>
                                <button id="snakePauseBtn">⏸ Пауза</button>
                                <button id="snakeResetBtn">🔄 Сброс</button>
                            </div>
                            <div class="snake-touch-controls" id="snakeTouchControls">
                                <button class="empty"></button>
                                <button data-dir="UP">⬆️</button>
                                <button class="empty"></button>
                                <button data-dir="LEFT">⬅️</button>
                                <button data-dir="DOWN">⬇️</button>
                                <button data-dir="RIGHT">➡️</button>
                            </div>
                        </div>
                    </div>

                    <!-- Курсы валют -->
                    <div class="card" id="currencyCard">
                        <div class="card-title">💱 Курсы валют (к рублю)</div>
                        <div class="currency-grid" id="currencyGrid">
                            <div class="currency-item"><div class="pair">USD/RUB</div><div class="value" id="usdRate">--</div></div>
                            <div class="currency-item"><div class="pair">EUR/RUB</div><div class="value" id="eurRate">--</div></div>
                        </div>
                        <div style="font-size:0.7rem; color:var(--text-light); margin-top:6px;">Обновляется раз в минуту</div>
                    </div>

                    <!-- Цитата -->
                    <div class="quote-box" id="quoteBox">
                        «Будь спортиком, а не неряхой!»
                        <div class="author">— Денис</div>
                    </div>

                    <!-- Сброс -->
                    <button class="reset-btn" id="resetBtn" style="grid-column:1/-1; justify-self:center;">🔥 Сбросить все данные (дни)</button>
                `;
            },

            // ================================================================
            // ИНИЦИАЛИЗАЦИЯ МОДУЛЕЙ
            // ================================================================
            initModules() {
                this.modules.savings = new SavingsModule(this);
                this.modules.masturbation = new MasturbationModule(this);
                this.modules.dota = new DotaModule(this);
                this.modules.analogClock = new AnalogClockModule();
                this.modules.clocks = new ClocksModule();
                this.modules.sportik = new SportikModule(this);
                this.modules.weekdays = new WeekdaysModule(this);
                this.modules.ttt = new TTTModule(this);
                this.modules.snake = new SnakeModule();
                this.modules.currency = new CurrencyModule();
                this.modules.quote = new QuoteModule();
                this.modules.reset = new ResetModule(this);
            },

            // ================================================================
            // УПРАВЛЕНИЕ СЧЁТЧИКАМИ
            // ================================================================
            startAllCounters() {
                this.stopAllCounters();

                this.intervals.savings = setInterval(() => {
                    this.savings += this.rate;
                    if (this.modules.savings) this.modules.savings.updateDisplay();
                    if (this.user && Math.floor(this.savings) % 10 === 0) {
                        FirebaseManager.updateUser(this.user.uid, { savings: this.savings });
                    }
                }, 1000);

                this.intervals.masturbation = setInterval(() => {
                    this.masturbation++;
                    if (this.modules.masturbation) this.modules.masturbation.updateDisplay();
                    if (this.user) {
                        FirebaseManager.updateUser(this.user.uid, { masturbationCount: this.masturbation });
                    }
                }, 5000);

                this.intervals.dota = setInterval(() => {
                    this.dota++;
                    if (this.modules.dota) this.modules.dota.updateDisplay();
                    if (this.user) {
                        FirebaseManager.updateUser(this.user.uid, { dotaCount: this.dota });
                    }
                }, 3000);

                this.intervals.tick = setInterval(() => {
                    if (this.modules.analogClock) this.modules.analogClock.draw();
                    if (this.modules.clocks) this.modules.clocks.draw();
                    if (this.modules.sportik) this.modules.sportik.updateTime();
                }, 1000);
            },

            stopAllCounters() {
                Object.values(this.intervals).forEach(id => { if (id) clearInterval(id); });
                this.intervals = { savings: null, masturbation: null, dota: null, bgWords: null, tick: null };
            },

            // ================================================================
            // ФОНОВЫЕ СЛОВА
            // ================================================================
            initBgWords() {
                const container = document.getElementById('bgWords');

                    span.textContent = words[Math.floor(Math.random() * words.length)];
                    span.style.left = Math.random() * 90 + '%';
                    span.style.top = Math.random() * 90 + '%';
                    span.style.transform = `rotate(${Math.random() * 360}deg)`;
                    span.style.fontSize = (2 + Math.random() * 3) + 'rem';
                    container.appendChild(span);
                }
                if (this.intervals.bgWords) clearInterval(this.intervals.bgWords);
                this.intervals.bgWords = setInterval(() => {
                    const els = container.querySelectorAll('.bg-word');

                        el.style.left = Math.random() * 90 + '%';

                        el.style.transform = `rotate(${Math.random() * 360}deg)`;

        // ================================================================
        // 5. МОДУЛИ (все классы полностью сохранены, но добавлен AnalogClockModule)
        // ================================================================

        // --- Аналоговые часы ---
        class AnalogClockModule {
            constructor() {
                this.canvas = document.getElementById('analogClockCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.draw();
            }

            draw() {
                const canvas = this.canvas;
                const ctx = this.ctx;
                const W = canvas.width,
                    H = canvas.height;
                const cx = W / 2,
                    cy = H / 2,
                    radius = 80;
                ctx.clearRect(0, 0, W, H);

                const now = new Date();
                const hours = now.getHours() % 12;
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                // Циферблат
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'var(--card)';
                ctx.fill();
                ctx.strokeStyle = 'var(--text)';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Часовая
                const hAngle = (hours / 12) * 2 * Math.PI + (minutes / 60) * (2 * Math.PI / 12) - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + 0.5 * radius * Math.cos(hAngle), cy + 0.5 * radius * Math.sin(hAngle));
                ctx.strokeStyle = 'var(--text)';
                ctx.lineWidth = 6;
                ctx.stroke();

                // Минутная
                const mAngle = (minutes / 60) * 2 * Math.PI - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + 0.7 * radius * Math.cos(mAngle), cy + 0.7 * radius * Math.sin(mAngle));
                ctx.strokeStyle = 'var(--text-light)';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Секундная
                const sAngle = (seconds / 60) * 2 * Math.PI - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + 0.85 * radius * Math.cos(sAngle), cy + 0.85 * radius * Math.sin(sAngle));
                ctx.strokeStyle = '#f44336';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Центр
                ctx.beginPath();
                ctx.arc(cx, cy, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#f44336';
                ctx.fill();

                // Цифры
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = 'var(--text)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let i = 1; i <= 12; i++) {
                    const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
                    const x = cx + 0.8 * radius * Math.cos(angle);
                    const y = cy + 0.8 * radius * Math.sin(angle);
                    ctx.fillText(i.toString(), x, y);
                }
            }
        }
