<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Денис — давай за дело!</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #1e1e2f;
            --card: #2d2d44;
            --text: #f0f0f0;
            --text-light: #b0b0c0;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --radius: 16px;
            --green: #4caf50;
            --red: #f44336;
            --yellow: #ffc107;
            --gray: #616161;
        }
        .light-theme {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #555;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            position: relative;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 16px;
            transition: 0.2s;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .hidden {
            display: none !important;
        }

        /* ===== ФОНОВЫЕ СЛОВА ===== */
        .bg-words {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-word {
            position: absolute;
            font-size: 3rem;
            font-weight: 900;
            color: var(--text);
            opacity: 0.04;
            white-space: nowrap;
            transition: all 2s ease;
            user-select: none;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            flex: 1;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .header .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
        }
        .header .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .theme-toggle {
            background: transparent;
            border: 2px solid var(--text-light);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text);
            transition: 0.2s;
        }
        .theme-toggle:hover {
            background: var(--text-light);
            color: var(--bg);
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-box {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 20px;
        }
        .auth-box h2 {
            font-size: 1.8rem;
        }
        .auth-box .sub {
            color: var(--text-light);
            margin-bottom: 16px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #3a3a5a;
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .auth-box input:focus {
            outline: none;
            border-color: #ffd93d;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            background: #ffd93d;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
        }
        .auth-box .btn-primary:hover {
            background: #ffc107;
        }
        .auth-box .toggle-link {
            text-align: center;
            margin-top: 12px;
            color: var(--text-light);
        }
        .auth-box .toggle-link span {
            color: #ffd93d;
            cursor: pointer;
            font-weight: 600;
        }

        /* ===== БЛОКИ ===== */
        .savings-block .amount {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--yellow);
        }
        .savings-block .rate {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* Мастурбация */
        .masturbation-block {
            background: linear-gradient(135deg, #ff6b9d, #b35eb5);
            border-radius: var(--radius);
            padding: 14px 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            filter: blur(8px);
            animation: pulse 2s ease-in-out infinite;
            user-select: none;
        }
        .masturbation-block.unblurred {
            filter: blur(0);
            animation: none;
        }
        .masturbation-block:hover {
            transform: scale(1.02);
        }
        .masturbation-title {
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-size: 1.1rem;
        }
        .masturbation-count {
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            margin: 6px 0 2px;
        }
        .masturbation-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        @keyframes pulse {
            0% { filter: blur(8px); opacity: 0.9; }
            50% { filter: blur(6px); opacity: 1; }
            100% { filter: blur(8px); opacity: 0.9; }
        }

        /* Dota */
        .dota-block {
            background: linear-gradient(145deg, #1a0f0a, #2d1810);
            border: 2px solid #b8860b;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.3);
            position: relative;
            overflow: hidden;
        }
        .dota-block .sad-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 2rem;
            opacity: 0.15;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 0;
        }
        .dota-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            position: relative;
            z-index: 1;
        }
        .dota-count {
            font-size: 3rem;
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            font-family: 'Cinzel', 'Segoe UI', serif;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }
        .dota-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .dota-controls button {
            background: #3a251a;
            border: 2px solid #b8860b;
            color: #d4af37;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .dota-controls button:hover {
            background: #b8860b;
            color: #1a0f0a;
            transform: scale(1.1);
        }
        .dota-controls input {
            width: 80px;
            padding: 8px 6px;
            background: #1a0f0a;
            border: 2px solid #b8860b;
            border-radius: 10px;
            color: #d4af37;
            font-size: 1.2rem;
            text-align: center;
            font-weight: 700;
        }
        .dota-controls input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* Часы */
        .clock-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .clock-canvas {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--card);
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* Спортик / Неряха (как было) */
        .today-card { text-align: center; }
        .today-card .date { color: var(--text-light); font-size: 0.9rem; margin-bottom: 4px; }
        .today-card .status { font-size: 1.6rem; font-weight: 700; margin: 6px 0; }
        .today-card .sub-status { font-size: 0.9rem; color: var(--text-light); }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0 4px; }
        .btn-choice { flex: 1 1 70px; padding: 10px 8px; border: 2px solid #3a3a5a; border-radius: 14px; background: transparent; color: var(--text); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.25s; }
        .btn-choice.active-sport { border-color: var(--green); background: rgba(76,175,80,0.25); color: #81c784; }
        .btn-choice.active-sloppy { border-color: var(--red); background: rgba(244,67,54,0.25); color: #ef9a9a; }
        .btn-choice.active-both { border-color: var(--yellow); background: rgba(255,193,7,0.2); color: #ffd54f; }
        .btn-choice.active-none { border-color: var(--gray); background: rgba(97,97,97,0.15); color: #aaa; }
        .btn-choice:hover { transform: scale(1.02); }
        .streak-container { display: flex; justify-content: space-around; margin: 10px 0 6px; flex-wrap: wrap; gap: 8px; }
        .streak-item { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
        .streak-item .emoji { font-size: 1.2rem; }
        .streak-item .count { font-weight: 700; }
        .streak-item.sport .count { color: var(--green); }
        .streak-item.sloppy .count { color: var(--red); }
        .streak-item.both .count { color: var(--yellow); }
        .streak-item.none .count { color: var(--gray); }
        .mini-chart { display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .mini-chart .day-dot { font-size: 1.4rem; line-height: 1; filter: grayscale(0.2); }
        .mini-chart .day-dot.today { border: 2px solid var(--yellow); border-radius: 50%; padding: 0 2px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 6px; }
        .stat-item { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px 6px; text-align: center; }
        .stat-item .number { font-size: 1.6rem; font-weight: 700; }
        .stat-item .label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-light); }
        .stat-item.sport .number { color: var(--green); }
        .stat-item.sloppy .number { color: var(--red); }
        .stat-item.both .number { color: var(--yellow); }

        /* Заметки */
        .weekdays-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .weekday-item { display: flex; flex-direction: column; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 8px 10px; }
        .weekday-item label { font-weight: 600; font-size: 0.85rem; color: var(--text-light); }
        .weekday-item input { width: 100%; padding: 6px 10px; border: 2px solid #3a3a5a; border-radius: 8px; background: var(--card); color: var(--text); font-size: 0.9rem; margin-top: 4px; max-width: 100%; }
        .weekday-item input:focus { outline: none; border-color: #ffd93d; }

        /* Крестики-нолики */
        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 240px; margin: 10px auto; }
        .ttt-cell { aspect-ratio: 1; background: var(--card); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; font-weight: 700; cursor: pointer; transition: 0.2s; border: 2px solid var(--text-light); }
        .ttt-cell:hover { background: var(--text-light); opacity: 0.6; }
        .ttt-cell.disabled { cursor: default; opacity: 0.7; }
        .ttt-status { text-align: center; font-size: 1rem; margin: 6px 0; color: var(--text-light); }
        .ttt-reset { display: block; margin: 8px auto 0; padding: 6px 20px; background: var(--yellow); border: none; border-radius: 10px; font-weight: 700; color: #1a1a2e; cursor: pointer; }
        .ttt-scores { display: flex; justify-content: space-around; font-size: 0.9rem; margin-top: 8px; }
        .ttt-scores span { font-weight: 700; }

        /* Змейка */
        .snake-container { display: flex; flex-direction: column; align-items: center; }
        .snake-canvas { border: 2px solid var(--text-light); border-radius: 10px; background: var(--card); }
        .snake-score { font-size: 1.2rem; margin-bottom: 6px; }
        .snake-controls { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .snake-controls button { padding: 6px 16px; border: none; border-radius: 10px; font-weight: 700; background: var(--yellow); color: #1a1a2e; cursor: pointer; }

        /* Курсы валют */
        .currency-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
        .currency-item { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px; text-align: center; }
        .currency-item .pair { font-size: 0.8rem; color: var(--text-light); }
        .currency-item .value { font-size: 1.6rem; font-weight: 700; color: var(--yellow); }

        /* Время столиц */
        .time-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 6px; }
        .time-item { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 6px; text-align: center; }
        .time-item .city { font-size: 0.8rem; font-weight: 600; color: var(--text-light); }
        .time-item .time { font-size: 1.2rem; font-weight: 700; }

        /* Игра с носками */
        .game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .game-overlay.hidden { display: none; }
        .game-box { background: var(--card); border-radius: var(--radius); padding: 24px 20px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .game-box h2 { margin-bottom: 6px; }
        .game-box .sub { color: var(--text-light); margin-bottom: 14px; }
        .sock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0 18px; justify-items: center; }
        .sock-item-game { font-size: 2.8rem; cursor: pointer; transition: 0.2s; background: #3a3a5a; border-radius: 12px; padding: 12px 6px; width: 100%; border: 2px solid transparent; user-select: none; }
        .sock-item-game:hover { transform: scale(1.05); background: #4a4a6a; }
        .sock-item-game.collected { opacity: 0.3; transform: scale(0.9); filter: grayscale(1); pointer-events: none; border-color: var(--green); }
        .game-progress { font-size: 1rem; font-weight: 600; margin: 6px 0; color: var(--text-light); }
        .game-complete { color: var(--yellow); font-size: 1.2rem; font-weight: 700; margin: 10px 0; }
        .game-box .btn-start-game { padding: 10px 28px; background: var(--green); border: none; border-radius: 14px; font-weight: 700; color: white; cursor: pointer; }

        /* Основная панель */
        .main-panel {
            display: grid;
            grid-column: 1 / -1;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .reset-btn { background: transparent; border: 1px solid #444; color: var(--text-light); padding: 6px 14px; border-radius: 30px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; margin-top: 6px; }
        .reset-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .quote-box { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px 16px; text-align: center; font-style: italic; color: var(--text-light); border-left: 4px solid #ffd93d; grid-column: 1 / -1; }
        .quote-box .author { font-style: normal; font-weight: 600; color: var(--text); margin-top: 4px; font-size: 0.8rem; }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 600px) {
            .app-container { grid-template-columns: 1fr; gap: 14px; }
            .header h1 { font-size: 1.6rem; }
            .weekdays-grid { grid-template-columns: 1fr; }
            .ttt-grid { max-width: 200px; }
            .time-grid { grid-template-columns: 1fr 1fr; }
            .currency-grid { grid-template-columns: 1fr 1fr; }
            .main-panel { grid-template-columns: 1fr; }
            .sock-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .sock-item-game { font-size: 2.2rem; padding: 10px 4px; }
            .game-box { max-width: 300px; }
            .streak-container { flex-direction: column; align-items: center; }
            .clock-canvas { width: 140px; height: 140px; }
        }
        @media (min-width: 1200px) {
            .main-panel { grid-template-columns: repeat(3, 1fr); }
            .weekdays-grid { grid-template-columns: 1fr 1fr; }
            .time-grid { grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>

    <!-- ===== ФОНОВЫЕ СЛОВА ===== -->
    <div class="bg-words" id="bgWords"></div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:99999; pointer-events:none;"></div>

    <!-- ===== ИГРА «СОБЕРИ НОСКИ» ===== -->
    <div class="game-overlay" id="gameOverlay">
        <div class="game-box">
            <h2>🧦 Собери носки и трусы!</h2>
            <div class="sub">Кликни на каждый предмет</div>
            <div class="sock-grid" id="sockGrid"></div>
            <div class="game-progress" id="sockProgress">Собрано: 0 / 5</div>
            <div id="gameCompleteMessage" class="hidden game-complete">🎉 Готово!</div>
            <button class="btn-start-game" id="startGameBtn">🔄 Заново</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
    <div class="app-container" id="app">

        <!-- ХЕДЕР -->
        <div class="header">
            <h1>Денис давай за дело!</h1>
            <div class="user-info" id="userInfo">
                <span id="userEmail"></span>
                <button class="theme-toggle" id="themeToggle">🌓</button>
                <button class="logout-btn" id="logoutBtn">🚪</button>
            </div>
        </div>

        <!-- АВТОРИЗАЦИЯ -->
        <div id="authSection" class="auth-box" style="grid-column:1/-1;">
            <h2 id="authTitle">Вход</h2>
            <div class="sub" id="authSub">Войди, чтобы продолжить</div>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Пароль (≥ 6 символов)" />
            <button class="btn-primary" id="authBtn">Войти</button>
            <div class="toggle-link">
                <span id="toggleText">Нет аккаунта? </span>
                <span id="toggleLink">Зарегистрироваться</span>
            </div>
        </div>

        <!-- ОСНОВНАЯ ПАНЕЛЬ -->
        <div id="mainPanel" class="main-panel hidden"></div>
    </div>

    <script>
        // ================================================================
        // 1. FIREBASE
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAbiVXdC3ctylepTMnhr4sqgZ2rqt6C3gY",
            authDomain: "denis-6f30c.firebaseapp.com",
            projectId: "denis-6f30c",
            storageBucket: "denis-6f30c.firebasestorage.app",
            messagingSenderId: "527961937380",
            appId: "1:527961937380:web:6ac6fa61275ff1bf2aa3f1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ================================================================
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
        }

        // ================================================================
        // 3. ИГРА С НОСКАМИ
        // ================================================================
        const gameOverlay = document.getElementById('gameOverlay');
        const sockGrid = document.getElementById('sockGrid');
        const sockProgress = document.getElementById('sockProgress');
        const gameCompleteMessage = document.getElementById('gameCompleteMessage');
        const startGameBtn = document.getElementById('startGameBtn');
        let collectedCount = 0;
        const totalItems = 5;
        let gameCompleted = false;
        const emojis = ['🧦', '🧦', '🧦', '🩲', '🩲'];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];

        function drawClock() {
            const canvas = document.getElementById('clockCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const W = canvas.width, H = canvas.height;
            const cx = W/2, cy = H/2, radius = 80;
            ctx.clearRect(0, 0, W, H);

            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Циферблат
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.fillStyle = 'var(--card)';
            ctx.fill();
            ctx.strokeStyle = 'var(--text)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Часовая стрелка
            const hourAngle = (hours / 12) * 2 * Math.PI + (minutes / 60) * (2 * Math.PI / 12) - Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + 0.5 * radius * Math.cos(hourAngle), cy + 0.5 * radius * Math.sin(hourAngle));
            ctx.strokeStyle = 'var(--text)';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Минутная стрелка
            const minAngle = (minutes / 60) * 2 * Math.PI - Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + 0.7 * radius * Math.cos(minAngle), cy + 0.7 * radius * Math.sin(minAngle));
            ctx.strokeStyle = 'var(--text-light)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Секундная стрелка
            const secAngle = (seconds / 60) * 2 * Math.PI - Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + 0.85 * radius * Math.cos(secAngle), cy + 0.85 * radius * Math.sin(secAngle));
            ctx.strokeStyle = '#f44336';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Центральная точка
            ctx.beginPath();
            ctx.arc(cx, cy, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#f44336';
            ctx.fill();

            // Цифры
            ctx.font = 'bold 14px sans-serif';
            ctx.fillStyle = 'var(--text)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (i / 12) * 2 * Math.PI - Math.PI/2;
                const x = cx + 0.85 * radius * Math.cos(angle);
                const y = cy + 0.85 * radius * Math.sin(angle);
                ctx.fillText(i.toString(), x, y);
            }
        }

        function getTodayKey() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function calculateStreak(entries, status) {
            const days = entries.map(doc => ({ id: doc.id, choice: doc.data().choice || 'none' }));
            days.sort((a, b) => a.id.localeCompare(b.id));
            const today = getTodayKey();
            const todayEntry = days.find(d => d.id === today);
            if (!todayEntry || todayEntry.choice !== status) return 0;
            let streak = 1;
            let currentDate = new Date(today);
            for (let i = 1; i < 365; i++) {
                currentDate.setDate(currentDate.getDate() - 1);
                const key = currentDate.getFullYear() + '-' +
                    String(currentDate.getMonth() + 1).padStart(2, '0') + '-' +
                    String(currentDate.getDate()).padStart(2, '0');
                const entry = days.find(d => d.id === key);
                if (entry && entry.choice === status) streak++;
                else break;
            }

        function renderTTT() {
            tttGrid.innerHTML = '';
            board.forEach((cell, idx) => {
                const div = document.createElement('div');
                div.className = 'ttt-cell';
                if (cell !== '' || gameOver) div.classList.add('disabled');

        function checkWinner(board) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                const [a,b,c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
            }
            if (board.every(cell => cell !== '')) return 'draw';
            return null;
        }

        function handleTTTClick(idx) {
            if (gameOver) return;
            if (board[idx] !== '') return;
            if (currentPlayer !== 'X') return;
            board[idx] = 'X';
            renderTTT();
            const winner = checkWinner(board);
            if (winner) {
                gameOver = true;
                if (winner === 'X') { tttWinsCount++; showToast('Ты выиграл! 🎉'); }
                else if (winner === 'O') { tttLossesCount++; showToast('ПК выиграл! 😢'); }
                else { showToast('Ничья!'); }
                saveTTTScores();
                tttStatus.textContent = winner === 'draw' ? 'Ничья!' : winner === 'X' ? 'Ты выиграл! 🎉' : 'ПК выиграл! 😢';
                renderTTT();
                return;
            }
            currentPlayer = 'O';
            tttStatus.textContent = 'Ход ПК (O)...';
            setTimeout(() => computerMove(), 400);
        }

        function computerMove() {
            if (gameOver) return;
            let move = findBestMove(board);
            if (move === -1) {
                const winner = checkWinner(board);
                if (winner) {
                    gameOver = true;
                    if (winner === 'X') { tttWinsCount++; showToast('Ты выиграл! 🎉'); }
                    else if (winner === 'O') { tttLossesCount++; showToast('ПК выиграл! 😢'); }
                    else showToast('Ничья!');
                    saveTTTScores();
                    tttStatus.textContent = winner === 'draw' ? 'Ничья!' : winner === 'X' ? 'Ты выиграл! 🎉' : 'ПК выиграл! 😢';
                    renderTTT();
                }
                return;
            }
            board[move] = 'O';
            renderTTT();
            const winner = checkWinner(board);
            if (winner) {
                gameOver = true;
                if (winner === 'X') { tttWinsCount++; showToast('Ты выиграл! 🎉'); }
                else if (winner === 'O') { tttLossesCount++; showToast('ПК выиграл! 😢'); }
                else showToast('Ничья!');
                saveTTTScores();
                tttStatus.textContent = winner === 'draw' ? 'Ничья!' : winner === 'X' ? 'Ты выиграл! 🎉' : 'ПК выиграл! 😢';
                renderTTT();
                return;
            }
            currentPlayer = 'X';
            tttStatus.textContent = 'Ваш ход (X)';
        }

        function findBestMove(board) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    if (checkWinner(board) === 'O') { board[i] = ''; return i; }
                    board[i] = '';
                }
            }
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'X';
                    if (checkWinner(board) === 'X') { board[i] = ''; return i; }
                    board[i] = '';
                }
            }
            const empty = board.map((v,i) => v === '' ? i : null).filter(v => v !== null);
            if (empty.length === 0) return -1;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        let snake = [];
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let food = { x: 0, y: 0 };

        let snakeGameRunning = false;
        let snakePaused = false;

        function initSnake() {
            snakeStartBtn.addEventListener('click', startSnake);

            snakeResetBtn.addEventListener('click', resetSnake);
            document.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                    if (!snakeGameRunning) return;
                    const dirs = {
                        'ArrowUp': 'UP',
                        'ArrowDown': 'DOWN',
                        'ArrowLeft': 'LEFT',
                        'ArrowRight': 'RIGHT'
                    };
                    const newDir = dirs[e.key];
                    if ((direction === 'UP' && newDir === 'DOWN') ||
                        (direction === 'DOWN' && newDir === 'UP') ||
                        (direction === 'LEFT' && newDir === 'RIGHT') ||
                        (direction === 'RIGHT' && newDir === 'LEFT')) {
                        return;
                    }
                    nextDirection = newDir;
                }
            });
            resetSnake();
        }

        function startSnake() {
            if (snakeGameRunning && !snakePaused) return;
            if (snakePaused) {
                snakePaused = false;
                snakePauseBtn.textContent = '⏸ Пауза';
                snakeInterval = setInterval(updateSnake, 150);
                return;
            }
            resetSnake();
            snakeGameRunning = true;
            snakePaused = false;
            snakePauseBtn.textContent = '⏸ Пауза';
            snakeInterval = setInterval(updateSnake, 150);
        }

        function togglePauseSnake() {
            if (!snakeGameRunning) return;
            snakePaused = !snakePaused;
            if (snakePaused) {
                clearInterval(snakeInterval);
                snakePauseBtn.textContent = '▶ Продолжить';
            } else {
                snakePauseBtn.textContent = '⏸ Пауза';
                snakeInterval = setInterval(updateSnake, 150);
            }
        }

        function resetSnake() {
            clearInterval(snakeInterval);
            snakeGameRunning = false;
            snakePaused = false;
            snakePauseBtn.textContent = '⏸ Пауза';
            snake = [{x: 10, y: 10}];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            snakeScoreValue = 0;
            snakeScore.textContent = '0';
            generateSnakeFood();
            drawSnake();
        }

        function generateSnakeFood() {
            const size = 20;
            const max = 19;
            let pos;
            do {
                pos = { x: Math.floor(Math.random() * (max+1)), y: Math.floor(Math.random() * (max+1)) };
            } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
            food = pos;
        }

        function updateSnake() {
            if (!snakeGameRunning || snakePaused) return;
            direction = nextDirection;
            const head = { ...snake[0] };
            switch (direction) {
                case 'UP': head.y--; break;
                case 'DOWN': head.y++; break;
                case 'LEFT': head.x--; break;
                case 'RIGHT': head.x++; break;
            }
            // Проверка столкновения со стенами
            if (head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19) {
                gameOverSnake();
                return;
            }
            // Проверка столкновения с собой
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOverSnake();
                return;
            }
            snake.unshift(head);
            // Еда
            if (head.x === food.x && head.y === food.y) {
                snakeScoreValue++;
                snakeScore.textContent = snakeScoreValue;
                generateSnakeFood();
            } else {
                snake.pop();
            }
            drawSnake();
        }

        function gameOverSnake() {
            clearInterval(snakeInterval);
            snakeGameRunning = false;
            showToast('Игра окончена! Очки: ' + snakeScoreValue);
            // Сохраняем рекорд (можно в Firestore)
            if (currentUser) {
                db.collection('users').doc(currentUser.uid).set({ snakeHighScore: snakeScoreValue }, { merge: true })

            }
        }

        function drawSnake() {
            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');
            const size = 15;
            const offset = 5;
            ctx.clearRect(0, 0, 300, 300);
            // Рисуем сетку (опционально)
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 20; i++) {
                ctx.beginPath();
                ctx.moveTo(i*size+offset, offset);
                ctx.lineTo(i*size+offset, 300-offset);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(offset, i*size+offset);
                ctx.lineTo(300-offset, i*size+offset);
                ctx.stroke();
            }
            // Змея
            snake.forEach((seg, idx) => {
                const x = seg.x * size + offset;
                const y = seg.y * size + offset;
                ctx.fillStyle = idx === 0 ? '#4caf50' : '#81c784';
                ctx.fillRect(x, y, size-2, size-2);
            });
            // Еда
            const fx = food.x * size + offset;
            const fy = food.y * size + offset;
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.arc(fx + size/2, fy + size/2, size/2-2, 0, 2*Math.PI);
            ctx.fill();
        }

                userEmailSpan.textContent = user.email;
                authSection.style.display = 'none';
                const gameCompletedFlag = localStorage.getItem('gameCompleted_' + user.uid);
                if (gameCompletedFlag === 'true') {
                    gameOverlay.classList.add('hidden');
                    const panel = document.getElementById('mainPanel');
                    panel.classList.remove('hidden');
                    buildMainPanel();
                    // Загружаем все данные из Firestore
                    loadSavingsFromFirebase();
                    loadDotaFromFirebase();
                    loadMasturbationCount();
                    loadMasturbationState();
                    loadWeekNotes();
                    loadTTTScores();
                    subscribeToDays(user);
                    // Фоновые слова
                    initBgWords();
                } else {
                    resetGame();
                }
            } else {
                currentUser = null;
                authSection.style.display = 'block';
                const panel = document.getElementById('mainPanel');
                panel.classList.add('hidden');
                if (unsubscribeDays) { unsubscribeDays(); unsubscribeDays = null; }
                allEntries = [];
                renderAll();
                stopAllCounters();
                gameOverlay.classList.add('hidden');
            }
        });

        // ================================================================
        // 22. СТАРТ
        // ================================================================
        renderSocks();
        updateSockProgress();
        console.log('Приложение готово!');
    </script>
</body>
</html>
